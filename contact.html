<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact me using this form.">
  <title>Contact | My Portfolio</title>
</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a> |
      <a href="about.html">About</a> |
      <a href="projects.html">Projects</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <p>Fill in the form below to write a message.</p>
    <form action="#" method="post">
      <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <br>
      <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <br>
      <div>
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" required>
      </div>
      <br>
      <div>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="6" cols="35" required></textarea>
      </div>
      <br>
      <button type="submit">Submit</button>
    </form>
    <p><strong>Note:</strong> This HTML-only form is a demonstration. It will not send messages until connected to a backend or form service.</p>
  </main>

  <footer>
    <p><a href="index.html">Back to Home</a></p>
  </footer>
</body>
</html>
